name: Refresh tournaments and publish site

on:
  schedule:
    # Four times a day: 0, 6, 12, 18 UTC = 6 AM, noon, 6 PM, midnight Central in winter (an hour later in summer)
    - cron: "0 0,6,12,18 * * *"
  push:
    branches: [main]  # a "Mac refresh" push only republishes; it already carries fresh data
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull listings from every sanction
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Mac refresh')
        run: python3 -I fetch.py
      - name: Pull team lists and find Shelby Steel registrations
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Mac refresh')
        run: python3 -I teams.py
      - name: Pull pool play and brackets for Shelby Steel tournaments
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Mac refresh')
        run: python3 -I games.py
      - name: Save new data back to the repo
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Mac refresh')
        run: |
          git config user.name "shelby-steel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/ cache/
          git diff --cached --quiet || (git commit -m "Refresh tournament data" && git pull --rebase -X theirs origin main && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # GitHub Pages occasionally times out on its side; try once more before reporting a failure.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
