name: Refresh tournaments and publish site

on:
  schedule:
    # 11:00 and 23:00 UTC = 6 AM / 6 PM Central (daylight time), 5 AM / 5 PM in winter
    - cron: "0 11,23 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull listings from every sanction
        run: python3 -I fetch.py
      - name: Pull team lists and find Shelby Steel registrations
        run: python3 -I teams.py
      - name: Save new data back to the repo
        run: |
          git config user.name "shelby-steel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/ cache/
          git diff --cached --quiet || (git commit -m "Refresh tournament data" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
