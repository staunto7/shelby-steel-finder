<meta charset="utf-8">
<title>Shelby Steel Tournament Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#F2F3F5;--surface:#FFFFFF;--ink:#101317;--muted:#5D6772;--line:#D7DCE1;--steel:#2E5873;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1013;--surface:#171A1E;--ink:#ECEFF2;--muted:#9AA4AE;--line:#2A3036;--steel:#8DB6D2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1013;--surface:#171A1E;--ink:#ECEFF2;--muted:#9AA4AE;--line:#2A3036;--steel:#8DB6D2;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,sans-serif}
.box{max-width:520px;margin:12vh auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
svg{width:64px;height:64px;color:var(--ink)}
h1{font-family:"Russo One","Arial Black",sans-serif;font-weight:400;letter-spacing:.05em;text-transform:uppercase;font-size:24px;margin:16px 0 8px}
p{color:var(--muted);font-size:16px;line-height:1.5}
a.btn{display:inline-block;margin-top:14px;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:4px;font-weight:600;text-decoration:none}
.url{margin-top:12px;font-size:14px;color:var(--steel);word-break:break-all}
</style>
